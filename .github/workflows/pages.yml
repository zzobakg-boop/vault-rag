name: 학습지 사이트 배포
# build는 옛 «브랜치에서 바로 배포»(pages-build-deployment)와 같은 단계·판본이다.
# deploy만 다르다. actions/deploy-pages는 v2~v5 모두 10분(MAX_TIMEOUT 600000)이 되면
# 배포를 스스로 취소한다. 그런데 이 사이트(약 500MB)는 파일 동기화가 들쭉날쭉이라
# (11/9~10 실측: 성공 땐 15~60초, 실패 땐 syncing_files 10분 뒤 서버가 배포를 버려 상태가 빈칸)
# 같은 API(POST/GET /pages/deployments)를 직접 부르고, 버려지면 같은 아티팩트로 다시 배포한다.
# 25분 기다리기(3981152)는 안 먹혔다 — 서버 쪽 10분 상한은 기다려서 넘길 수 없다(11/10 638e40a·f3a49ab).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # 이 실행의 github-pages 아티팩트 id 찾기
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const sha = context.sha
            const { data: list } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId, name: 'github-pages', per_page: 10 })
            const art = list.artifacts.find(a => a.name === 'github-pages')
            if (!art) return core.setFailed('github-pages 아티팩트가 없다')
            core.info(`아티팩트 ${art.size_in_bytes}바이트`)
            const FINAL = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']
            const TRIES = 4            // 한 번에 최대 ~12분 → 넉 번이면 50분 안
            const PER_TRY = 12 * 60 * 1000
            const BLANK_GIVEUP = 90 * 1000   // 상태가 빈칸으로 바뀐 뒤 이만큼 지나면 버려진 것으로 본다
            const sleep = ms => new Promise(r => setTimeout(r, ms))
            let lastFail = ''
            for (let t = 1; t <= TRIES; t++) {
              const { data: dep } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                owner, repo, artifact_id: art.id, pages_build_version: sha, oidc_token: await core.getIDToken() })
              const id = dep.id || sha
              if (dep.page_url) core.setOutput('page_url', dep.page_url)
              core.info(`[${t}/${TRIES}] 배포 만듦 ${id}`)
              const start = Date.now()
              let last = null, errors = 0, blankSince = 0, outcome = 'timeout'
              while (Date.now() - start < PER_TRY) {
                await sleep(15000)
                let data
                try {
                  ({ data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id }))
                  errors = 0
                } catch (e) {
                  if (++errors >= 10) { outcome = `상태 조회 오류 10번: ${e.message}`; break }
                  continue
                }
                const st = data.status || ''
                if (st !== last) core.info(`[${t}] ${Math.round((Date.now() - start) / 1000)}초 · ${st || '(상태 빈칸)'}`)
                last = st
                if (st === 'succeed') { outcome = 'ok'; break }
                if (FINAL.includes(st)) { outcome = st; break }
                if (st === '') { blankSince = blankSince || Date.now(); if (Date.now() - blankSince > BLANK_GIVEUP) { outcome = '서버가 배포를 버림(상태 빈칸)'; break } }
                else blankSince = 0
              }
              if (outcome === 'ok') return core.info(`[${t}] 성공 · ${Math.round((Date.now() - start) / 1000)}초`)
              if (outcome === 'timeout') await github.request('POST /repos/{owner}/{repo}/pages/deployments/{id}/cancel', { owner, repo, id }).catch(() => {})
              lastFail = outcome
              core.warning(`[${t}/${TRIES}] 실패: ${outcome}${t < TRIES ? ' → 같은 아티팩트로 다시 배포' : ''}`)
            }
            core.setFailed(`${TRIES}번 모두 실패 · 마지막: ${lastFail}`)
