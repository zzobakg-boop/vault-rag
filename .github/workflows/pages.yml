name: 학습지 사이트 배포
# build는 옛 «브랜치에서 바로 배포»(pages-build-deployment)와 같은 단계·판본이다.
# deploy만 다르다. actions/deploy-pages는 v2~v5 모두 10분(MAX_TIMEOUT 600000)이 되면
# 배포를 스스로 취소한다. 그런데 이 사이트(약 500MB)는 파일 동기화가 10분 언저리라
# 11/8~9에 7번 잘렸다(한 번은 finished_file_sync가 뜬 순간 취소). 그래서 같은 API
# (POST/GET /pages/deployments)를 직접 불러 25분까지 기다린다. 실패 판정 상태는 deploy-pages와 같다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # 이 실행의 github-pages 아티팩트 id 찾기
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const sha = context.sha
            const { data: list } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId, name: 'github-pages', per_page: 10 })
            const art = list.artifacts.find(a => a.name === 'github-pages')
            if (!art) return core.setFailed('github-pages 아티팩트가 없다')
            const { data: dep } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: art.id, pages_build_version: sha, oidc_token: await core.getIDToken() })
            const id = dep.id || sha
            if (dep.page_url) core.setOutput('page_url', dep.page_url)
            core.info(`배포 만듦 ${id} · 아티팩트 ${art.size_in_bytes}바이트`)
            const FINAL = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']
            const LIMIT = 25 * 60 * 1000, start = Date.now()
            let last = null, errors = 0
            while (Date.now() - start < LIMIT) {
              await new Promise(r => setTimeout(r, 15000))
              try {
                const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id })
                errors = 0
                if (data.status !== last) core.info(`${Math.round((Date.now() - start) / 1000)}초 · ${data.status || '(상태 빈칸)'}`)
                last = data.status
                if (data.status === 'succeed') return
                if (FINAL.includes(data.status)) return core.setFailed(`배포 실패: ${data.status}`)
              } catch (e) {
                if (++errors >= 10) return core.setFailed(`상태 조회 오류 10번: ${e.message}`)
              }
            }
            // 25분을 넘기면 다음 배포와 겹치지 않게 취소한다(deploy-pages와 같은 처리)
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{id}/cancel', { owner, repo, id }).catch(() => {})
            core.setFailed('25분 안에 끝나지 않아 취소했다')
