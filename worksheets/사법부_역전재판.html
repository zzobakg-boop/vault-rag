<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚖️ 역전재판: 사법부를 지켜라!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#1a1a2e;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}
.game{max-width:700px;width:100%;margin:0 auto;padding:10px}

/* 법정 배경 */
.courtroom{background:linear-gradient(180deg,#2d1b4e 0%,#1a1a2e 50%,#0f0f23 100%);border:3px solid #8b6914;border-radius:12px;overflow:hidden;box-shadow:0 0 30px rgba(139,105,20,0.3)}

/* 상단 바 */
.topbar{background:linear-gradient(90deg,#8b6914,#d4a017,#8b6914);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;font-size:0.85em}
.topbar .chapter{font-weight:700;color:#1a1a2e}
.topbar .score{color:#1a1a2e;font-weight:700}

/* 캐릭터 영역 */
.scene{padding:20px;min-height:200px;position:relative;display:flex;align-items:flex-end;gap:15px}
.character{text-align:center;flex-shrink:0}
.character .avatar{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.5em;border:3px solid #d4a017}
.character .name{font-size:0.75em;margin-top:4px;color:#d4a017;font-weight:700}
.avatar-judge{background:#4a0e4e}
.avatar-lawyer{background:#0e3b4e}
.avatar-witness{background:#4e3b0e}
.avatar-prosecutor{background:#4e0e0e}

/* 대사 박스 */
.dialogue{flex:1;background:rgba(0,0,0,0.6);border:2px solid #d4a017;border-radius:8px;padding:16px;min-height:100px;position:relative}
.dialogue .speaker{color:#d4a017;font-weight:700;font-size:0.9em;margin-bottom:6px}
.dialogue .text{font-size:0.95em;line-height:1.6;color:#e0e0e0}
.dialogue .text .highlight{color:#ff6b6b;font-weight:700}
.dialogue .text .keyword{color:#ffd93d;font-weight:700}

/* 이의 있습니다 버튼 */
.objection-area{padding:15px;text-align:center}
.btn-objection{background:linear-gradient(180deg,#ff4444,#cc0000);color:#fff;border:3px solid #ff6666;padding:15px 40px;font-size:1.3em;font-weight:900;border-radius:8px;cursor:pointer;text-transform:uppercase;letter-spacing:2px;animation:pulse 1.5s infinite;font-family:'Noto Sans KR',sans-serif}
.btn-objection:hover{background:linear-gradient(180deg,#ff6666,#ee2222);transform:scale(1.05)}
@keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(255,68,68,0.5)}50%{box-shadow:0 0 25px rgba(255,68,68,0.8)}}

/* 선택지 */
.choices{padding:10px 20px 20px}
.choice-btn{display:block;width:100%;padding:12px 16px;margin:8px 0;background:rgba(139,105,20,0.2);border:2px solid #8b6914;color:#fff;border-radius:8px;font-size:0.95em;cursor:pointer;text-align:left;transition:all 0.2s;font-family:'Noto Sans KR',sans-serif}
.choice-btn:hover{background:rgba(139,105,20,0.5);border-color:#d4a017;transform:translateX(5px)}
.choice-btn.correct{background:rgba(52,199,89,0.3);border-color:#34c759;color:#34c759}
.choice-btn.wrong{background:rgba(255,59,48,0.3);border-color:#ff3b30;color:#ff3b30}
.choice-btn:disabled{cursor:default;opacity:0.7}

/* 결과 */
.result{padding:15px 20px;text-align:center;font-size:0.9em}
.result.correct-msg{color:#34c759}
.result.wrong-msg{color:#ff3b30}

/* 네비게이션 */
.nav{padding:10px 20px 20px;text-align:center}
.btn-next{background:#d4a017;color:#1a1a2e;border:none;padding:10px 30px;border-radius:8px;font-size:1em;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.btn-next:hover{background:#e8b730}

/* 이의 있습니다 오버레이 */
.objection-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:100;display:none}
.objection-overlay.show{display:flex}
.objection-text{font-size:4em;font-weight:900;color:#ff4444;text-shadow:0 0 30px rgba(255,68,68,0.8);animation:objectionAnim 0.5s ease-out}
@keyframes objectionAnim{0%{transform:scale(3);opacity:0}50%{transform:scale(0.9)}100%{transform:scale(1);opacity:1}}

/* 최종 결과 */
.final-result{padding:30px;text-align:center}
.final-result h2{color:#d4a017;font-size:1.8em;margin-bottom:15px}
.final-result .grade{font-size:3em;margin:15px 0}
.final-result .detail{color:#aaa;font-size:0.9em;line-height:1.8}
.btn-retry{background:#d4a017;color:#1a1a2e;border:none;padding:12px 30px;border-radius:8px;font-size:1em;font-weight:700;cursor:pointer;margin-top:20px;font-family:'Noto Sans KR',sans-serif}

/* 진행바 */
.progress{height:4px;background:#333;margin:0}
.progress-bar{height:100%;background:#d4a017;transition:width 0.3s}

/* 모바일 */
@media(max-width:600px){
  .scene{flex-direction:column;align-items:center}
  .character .avatar{width:60px;height:60px;font-size:2em}
  .btn-objection{font-size:1em;padding:12px 30px}
  .objection-text{font-size:2.5em}
}
</style>
</head>
<body>
<div class="game">
<div class="courtroom">
  <div class="topbar">
    <span class="chapter">⚖️ 사법부를 지켜라!</span>
    <span class="score">점수: <span id="score">0</span>/100</span>
  </div>
  <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div id="gameArea"></div>
</div>
</div>

<div class="objection-overlay" id="objectionOverlay">
  <div class="objection-text">이의 있습니다!</div>
</div>

<script>
const SCENES = [
  // === 프롤로그 ===
  {
    type: 'dialogue',
    character: {emoji:'👨‍⚖️', name:'재판장', class:'avatar-judge'},
    speaker: '재판장',
    text: '지금부터 <span class="keyword">사법부 특별 재판</span>을 시작합니다. 오늘 여러분은 신입 변호사로서 다양한 사건을 해결해야 합니다.',
    next: 1
  },
  {
    type: 'dialogue',
    character: {emoji:'👨‍💼', name:'나(변호사)', class:'avatar-lawyer'},
    speaker: '나 (신입 변호사)',
    text: '(긴장된다... 법을 <span class="keyword">해석하고 적용</span>하여 분쟁을 해결하는 것이 사법부의 역할... 잘 해내야 해!)',
    next: 2
  },

  // === 1라운드: 사법권이란? ===
  {
    type: 'dialogue',
    character: {emoji:'👨‍⚖️', name:'재판장', class:'avatar-judge'},
    speaker: '재판장',
    text: '첫 번째 시험입니다. <span class="highlight">사법권</span>이란 무엇인지 답하시오.',
    next: 3
  },
  {
    type: 'quiz',
    question: '사법권의 의미로 가장 적절한 것은?',
    choices: [
      '법률을 만드는 권한',
      '법을 해석·적용하여 분쟁을 해결하는 권한',
      '법률을 집행하는 권한',
      '헌법을 개정하는 권한'
    ],
    answer: 1,
    points: 10,
    explanation: '사법권은 법을 해석·적용하여 분쟁을 해결하는 권한으로, 법관으로 구성된 법원에 속합니다. (헌법 제101조)',
    next: 4
  },

  // === 2라운드: 법원의 종류 ===
  {
    type: 'dialogue',
    character: {emoji:'🕵️', name:'의뢰인', class:'avatar-witness'},
    speaker: '의뢰인',
    text: '변호사님! 저는 사기 혐의로 기소되었는데 억울합니다. 지금 <span class="keyword">지방법원</span>에서 1심 재판을 받고 있어요.',
    next: 5
  },
  {
    type: 'dialogue',
    character: {emoji:'👨‍💼', name:'나(변호사)', class:'avatar-lawyer'},
    speaker: '나',
    text: '걱정 마세요. 만약 1심에서 불리한 판결이 나와도 <span class="keyword">상급 법원</span>에 다시 재판을 청구할 수 있습니다.',
    next: 6
  },
  {
    type: 'quiz',
    question: '1심 판결에 불복하여 상급 법원에 재판을 청구하는 것을 무엇이라 하는가?',
    choices: [
      '상고',
      '항소',
      '제청',
      '탄핵'
    ],
    answer: 1,
    points: 10,
    explanation: '항소는 1심 판결에 불복하여 고등법원(2심)에 재판을 청구하는 것입니다. 상고는 2심→대법원(3심)입니다.',
    next: 7
  },

  // === 3라운드: 3심제 ===
  {
    type: 'dialogue',
    character: {emoji:'👩‍⚖️', name:'검사', class:'avatar-prosecutor'},
    speaker: '검사',
    text: '피고인은 명백한 유죄입니다! 재판은 이번 한 번으로 끝내야 합니다!',
    next: 8
  },
  {
    type: 'objection',
    text: '검사의 주장에 모순이 있습니다! 우리나라는 3심제를 채택하고 있습니다!',
    next: 9
  },
  {
    type: 'quiz',
    question: '3심제의 순서로 올바른 것은?',
    choices: [
      '대법원(1심) → 고등법원(2심) → 지방법원(3심)',
      '고등법원(1심) → 지방법원(2심) → 대법원(3심)',
      '지방법원(1심) → 고등법원(2심) → 대법원(3심)',
      '지방법원(1심) → 대법원(2심) → 헌법재판소(3심)'
    ],
    answer: 2,
    points: 15,
    explanation: '3심제: 지방법원(1심) → 항소 → 고등법원(2심) → 상고 → 대법원(3심, 최종심). 공정한 재판을 위해 최대 세 번까지 재판받을 수 있습니다.',
    next: 10
  },

  // === 4라운드: 사법권의 독립 ===
  {
    type: 'dialogue',
    character: {emoji:'🏛️', name:'정치인', class:'avatar-witness'},
    speaker: '???',
    text: '재판장님, 이 사건은 정부의 입장을 고려해서 판결해 주시면 좋겠습니다.',
    next: 11
  },
  {
    type: 'objection',
    text: '법관은 헌법과 법률에 의하여 그 양심에 따라 독립하여 심판합니다!',
    next: 12
  },
  {
    type: 'quiz',
    question: '사법권 독립에 대한 설명으로 옳은 것은?',
    choices: [
      '법관은 대통령의 지시에 따라 판결해야 한다',
      '법원은 여론조사를 기준으로 판결해야 한다',
      '법관은 헌법과 법률에 따라 양심에 따라 독립하여 심판한다',
      '국회가 개별 사건의 판결 내용을 미리 정할 수 있다'
    ],
    answer: 2,
    points: 15,
    explanation: '헌법 제103조: 법관은 헌법과 법률에 의하여 그 양심에 따라 독립하여 심판한다. 사법부가 독립해야 공정한 재판이 가능합니다.',
    next: 13
  },

  // === 5라운드: 헌법재판소 ===
  {
    type: 'dialogue',
    character: {emoji:'👨‍💼', name:'나(변호사)', class:'avatar-lawyer'},
    speaker: '나',
    text: '잠깐... 이 사건에 적용되는 법률 자체가 <span class="highlight">헌법에 위반</span>되는 것 같습니다!',
    next: 14
  },
  {
    type: 'dialogue',
    character: {emoji:'👨‍⚖️', name:'재판장', class:'avatar-judge'},
    speaker: '재판장',
    text: '그렇다면 법원이 직접 위헌 결정을 내릴 수 있을까요?',
    next: 15
  },
  {
    type: 'quiz',
    question: '법원이 재판 중 법률이 헌법에 위반된다고 판단하면 어떻게 해야 하는가?',
    choices: [
      '법원이 직접 위헌 결정을 내린다',
      '대통령에게 법률 폐지를 요청한다',
      '헌법재판소에 위헌 법률 심판을 제청한다',
      '국회에 법률 개정을 건의한다'
    ],
    answer: 2,
    points: 15,
    explanation: '법원은 직접 법률을 무효로 만들 수 없고, 헌법재판소에 위헌 법률 심판을 제청해야 합니다. 위헌 여부를 최종 결정하는 것은 헌법재판소입니다.',
    next: 16
  },

  // === 6라운드: 헌법재판소 구성 ===
  {
    type: 'quiz',
    question: '헌법재판소 재판관 9인의 구성으로 옳은 것은?',
    choices: [
      '대통령이 9인 모두 단독 선출',
      '국회 선출 3인 + 대법원장 지명 3인 + 대통령 지명 3인',
      '국회 선출 5인 + 대통령 지명 4인',
      '대법관 중에서 9인을 호선'
    ],
    answer: 1,
    points: 10,
    explanation: '헌법재판소 재판관 9인: 국회 선출 3인 + 대법원장 지명 3인 + 대통령 지명 3인. 모두 대통령이 임명하지만, 선출·지명 주체가 3곳으로 나뉩니다. 임기는 6년이며 연임 가능합니다.',
    next: 17
  },

  // === 7라운드: 탄핵 ===
  {
    type: 'dialogue',
    character: {emoji:'📺', name:'뉴스', class:'avatar-witness'},
    speaker: '속보 뉴스',
    text: '"<span class="highlight">국회</span>, □□ 장관에 대해 <span class="keyword">탄핵 소추</span> 의결! 헌법재판소로 넘어갈 전망"',
    next: 18
  },
  {
    type: 'quiz',
    question: '탄핵 절차에 대한 설명으로 옳은 것은?',

      '탄핵 소추는 헌법재판소가 하고, 탄핵 심판은 국회가 한다',
      '탄핵 소추와 심판 모두 대법원이 담당한다',
      '탄핵 소추는 국회가 하고, 탄핵 심판은 헌법재판소가 한다',
      '탄핵은 대통령이 단독으로 결정한다'
    ],
    answer: 2,
    points: 15,
    explanation: '탄핵 소추는 국회(입법부)가 의결하고, 탄핵 심판은 헌법재판소가 합니다. 재판관 6인 이상 찬성 시 파면됩니다. 두 기관이 역할을 나눠 권력 남용을 방지합니다.',

    speaker: '재판장',
    text: '마지막 시험입니다. 법원과 헌법재판소의 차이를 정확히 구분할 수 있어야 합니다.',
    next: 20
  },
  {
    type: 'quiz',
    question: '다음 중 헌법재판소의 권한이 아닌 것은?',
    choices: [
      '위헌 법률 심판',
      '민사·형사 사건 재판',

      '정당 해산 심판'
    ],
    answer: 1,
    points: 10,
    explanation: '민사·형사·행정 사건의 재판은 법원의 권한입니다. 헌법재판소는 위헌 법률 심판, 헌법 소원, 탄핵 심판, 권한 쟁의 심판, 정당 해산 심판을 담당합니다.',
    next: 21
  },

  // === 에필로그 ===
  {
    type: 'finale'
  }
];

let currentScene = 0;
let score = 0;
let totalQuestions = SCENES.filter(s => s.type === 'quiz').length;

function render() {
  const scene = SCENES[currentScene];
  const area = document.getElementById('gameArea');
  const progress = ((currentScene + 1) / SCENES.length * 100);
  document.getElementById('progressBar').style.width = progress + '%';
  document.getElementById('score').textContent = score;

  if (scene.type === 'dialogue') {
    area.innerHTML = `
      <div class="scene">
        <div class="character">
          <div class="avatar ${scene.character.class}">${scene.character.emoji}</div>
          <div class="name">${scene.character.name}</div>
        </div>
        <div class="dialogue">
          <div class="speaker">${scene.speaker}</div>
          <div class="text">${scene.text}</div>
        </div>
      </div>
      <div class="nav">
        <button class="btn-next" onclick="goTo(${scene.next})">다음 ▶</button>
      </div>
    `;
  }
  else if (scene.type === 'objection') {
    area.innerHTML = `
      <div class="scene">
        <div class="character">
          <div class="avatar avatar-lawyer">👨‍💼</div>
          <div class="name">나(변호사)</div>
        </div>
        <div class="dialogue">
          <div class="speaker">나</div>
          <div class="text">(모순을 발견했다...!)</div>
        </div>
      </div>
      <div class="objection-area">
        <button class="btn-objection" onclick="showObjection(${scene.next})">이의 있습니다!</button>
      </div>
    `;
  }
  else if (scene.type === 'quiz') {
    let choicesHTML = scene.choices.map((c, i) =>
      `<button class="choice-btn" onclick="answer(${i}, ${scene.answer}, ${scene.points}, ${scene.next})">${['①','②','③','④','⑤'][i]} ${c}</button>`
    ).join('');
    area.innerHTML = `
      <div class="scene">
        <div class="character">
          <div class="avatar avatar-judge">⚖️</div>
          <div class="name">출제</div>
        </div>
        <div class="dialogue">
          <div class="speaker">문제</div>
          <div class="text">${scene.question}</div>
        </div>
      </div>
      <div class="choices" id="choicesArea">${choicesHTML}</div>
      <div class="result" id="resultArea"></div>
    `;
  }
  else if (scene.type === 'finale') {
    let grade, comment;
    if (score >= 90) { grade = '🏆 S등급'; comment = '완벽한 변호사! 사법부의 수호자입니다!'; }
    else if (score >= 70) { grade = '🥇 A등급'; comment = '훌륭합니다! 법의 수호자로서 손색없습니다.'; }
    else if (score >= 50) { grade = '🥈 B등급'; comment = '좋습니다! 조금 더 공부하면 에이스 변호사!'; }
    else { grade = '📚 수습 변호사'; comment = '사법부에 대해 더 공부해봅시다!'; }

    area.innerHTML = `
      <div class="final-result">
        <h2>⚖️ 재판 종료!</h2>
        <div class="grade">${grade}</div>
        <div style="font-size:2em;color:#d4a017;margin:10px 0">${score}/100점</div>
        <div class="detail">
          ${comment}<br><br>
          오늘 배운 것:<br>
          ✅ 사법권 = 법 해석·적용으로 분쟁 해결<br>
          ✅ 3심제 = 지방법원 → 고등법원 → 대법원<br>
          ✅ 사법권 독립 = 법관은 양심에 따라 독립 심판<br>
          ✅ 헌법재판소 = 위헌심판, 탄핵, 헌법소원 등<br>
          ✅ 법원 ≠ 헌법재판소 (역할이 다르다!)
        </div>
        <button class="btn-retry" onclick="retry()">🔄 다시 도전하기</button>
      </div>
    `;
  }
}

function goTo(next) {
  currentScene = next;
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function showObjection(next) {
  const overlay = document.getElementById('objectionOverlay');
  overlay.classList.add('show');
  setTimeout(() => {
    overlay.classList.remove('show');
    // 이의 제기 후 대사 표시
    const area = document.getElementById('gameArea');
    const scene = SCENES[currentScene];
    area.innerHTML = `
      <div class="scene">
        <div class="character">
          <div class="avatar avatar-lawyer">👨‍💼</div>
          <div class="name">나(변호사)</div>
        </div>
        <div class="dialogue">
          <div class="speaker">나</div>
          <div class="text" style="color:#ff6b6b;font-weight:700">${scene.text}</div>
        </div>
      </div>
      <div class="nav">
        <button class="btn-next" onclick="goTo(${next})">다음 ▶</button>
      </div>
    `;
  }, 1500);
}

function answer(selected, correct, points, next) {
  const btns = document.querySelectorAll('.choice-btn');
  const result = document.getElementById('resultArea');
  const scene = SCENES[currentScene];

  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === correct) btn.classList.add('correct');
    if (i === selected && i !== correct) btn.classList.add('wrong');
  });

  if (selected === correct) {
    score += points;
    document.getElementById('score').textContent = score;
    result.innerHTML = `<div class="correct-msg">✅ 정답! (+${points}점)<br><br>${scene.explanation}</div>`;
  } else {
    result.innerHTML = `<div class="wrong-msg">❌ 오답!<br><br>${scene.explanation}</div>`;
  }

  // 다음 버튼 추가
  const nav = document.createElement('div');
  nav.className = 'nav';
  nav.innerHTML = `<button class="btn-next" onclick="goTo(${next})">다음 ▶</button>`;
  document.getElementById('choicesArea').after(nav);
}

function retry() {
  currentScene = 0;
  score = 0;
  render();
}

// 시작
render();
</script>
</body>
</html>
