    }

    for(let i=0;i<n;i++){

    const rg=ns('g',{'clip-path':'url(#landclip)', id:'polities'});
    REGIONS.forEach(r=>{
      const p=ns('path',{class:'region', id:'r-'+r.id, d:hullPath(r.hull), fill:FILL[r.owner[0]], stroke:'none'});
      p.style.fill=FILL[r.owner[0]];
      rg.appendChild(p);
    });
    worldG.appendChild(rg);
    worldG.appendChild(ns('path',{d:landD(), fill:'none', stroke:'#6a542e', 'stroke-width':'1.15'}));

    const rivers=ns('g',{fill:'none', 'stroke':'#3d7f8c', 'stroke-linecap':'round'});
    rivers.appendChild(ns('path',{d:linePath(GEO.danube), 'stroke-width':'2.2'}));
    rivers.appendChild(ns('path',{d:linePath(RHINE), 'stroke-width':'2.2'}));
    worldG.appendChild(rivers);

    const rgR=ns('g',{id:'routes'});
    ROUTES.forEach(rt=>{
      const d=linePath(rt.pts);
      const under=ns('path',{class:'route-under', d, stroke:rt.color, 'stroke-width': String(rt.width+5)});
      const over=ns('path',{class:'route', id:'rt-'+rt.id, d, stroke:rt.color, 'stroke-width':String(rt.width)});
      rgR.appendChild(under); rgR.appendChild(over);
    });
    worldG.appendChild(rgR);

    const pins=ns('g',{id:'pins'});
    [['rome',12.50,41.90],['rav',12.20,44.42],['carth',10.32,36.85],['const',28.98,41.01]].forEach(([id,lon,lat])=>{
      const [x,y]=project(lon,lat);
      pins.appendChild(ns('circle',{class:'pin', id:'pin-'+id, cx:x.toFixed(1), cy:y.toFixed(1), r:'4.5', fill:'#f3ead8'}));
    });
    worldG.appendChild(pins);

    const rip=ns('g',{id:'ripples'});
    worldG.appendChild(rip);

    svg.appendChild(worldG);

    /* measure routes */
    routeGeom.length=0;
    ROUTES.forEach(rt=>{
      const el=document.getElementById('rt-'+rt.id);
      const L=el.getTotalLength()||1;
      el.style.strokeDasharray=String(L);
      el.style.strokeDashoffset=String(L);
      const samples=[];
      const step=Math.max(2, L/180);
      for(let d=0; d<=L; d+=step){
        const p=el.getPointAtLength(d);
        samples.push({x:p.x,y:p.y,d});
      }
      routeGeom.push({el, L, samples, rt});
    });

    /* labels */
    labelsEl.innerHTML='';
    LABELS.forEach((lb,i)=>{
      const div=document.createElement('div');
      div.className='lbl '+lb.kind;
      div.dataset.i=i;
      const col=lb.col? '<span class="dot" style="background:var(--'+lb.col+')"></span>' : '';
      div.innerHTML=col+'<span>'+lb.t+'</span>'+(lb.sub?'<small>'+lb.sub+'</small>':'');
      labelsEl.appendChild(div);
    });

    sizeCanvas();
    seedParticles();
    applyStage(stage, true);
  }

  function sizeCanvas(){
    const dpr=Math.min(window.devicePixelRatio||1, 2);
    canvas.width=Math.floor(PROJ.W*dpr);
    canvas.height=Math.floor(PROJ.H*dpr);
    canvas.style.width=PROJ.W+'px';
    canvas.style.height=PROJ.H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function seedParticles(){
    particles.length=0;
    if(REDUCE) return;
    routeGeom.forEach((g,gi)=>{
      const n=g.rt.n;
      for(let i=0;i<n;i++){
        particles.push({gi, t:Math.random(), sp:0.0018+Math.random()*0.0032, w:1.2+Math.random()*2.2});
      }
    });
  }

  function camFromStage(s){
    const st=STAGES[s];
    let k=st.cam.k;
    if(PROJ.W<700) k*=1.12;
    const [x,y]=project(st.cam.lon, st.cam.lat);
    return {x,y,k};
  }
  function worldTransform(){
    return 'translate('+PROJ.W/2+','+PROJ.H/2+') scale('+cam.k+') translate('+(-cam.x)+','+(-cam.y)+')';
  }
  function toScreen(lon,lat){
    const [x,y]=project(lon,lat);
    return [(x-cam.x)*cam.k+PROJ.W/2, (y-cam.y)*cam.k+PROJ.H/2];
  }

  function applyStage(n, instant){
    n=Math.max(0,Math.min(STAGES.length-1,n));
    stage=n;
    const s=STAGES[n];
    document.getElementById('kicker').textContent=s.kicker;
    document.getElementById('year').textContent=s.y;
    document.getElementById('desc').textContent=s.d;
    document.getElementById('barfill').style.width=((n+1)/STAGES.length*100)+'%';
    [...document.querySelectorAll('#steps button')].forEach((b,i)=>b.setAttribute('aria-current', i===n?'true':'false'));

    REGIONS.forEach(r=>{
      const el=document.getElementById('r-'+r.id);
      if(el){
        if(REDUCE || instant) el.style.transition='none';
        else el.style.transition='';
        el.style.fill = FILL[r.owner[n]];
      }
    });
    let wre=0, wreMax=0;
    REGIONS.forEach(r=>{
      if(!r.w) return;
      wreMax+=r.w;
      if(r.owner[n]==='wre') wre+=r.w;
    });
    const p=wreMax? wre/wreMax : 0;
    document.getElementById('remainN').textContent=Math.round(p*100)+'%';
    const pips=document.getElementById('pips');
    pips.innerHTML='';
    for(let i=0;i<7;i++){
      const sp=document.createElement('span');
      if(i < Math.round(p*7)) sp.className='on';
      pips.appendChild(sp);
    }

    routeGeom.forEach(g=>{
      const rev=g.rt.reveal[n];
      const off=g.L*(1-rev);
      if(REDUCE || instant){
        g.el.style.transition='none';
        g.el.style.strokeDashoffset=String(off);
      }else{
        g.el.style.transition='stroke-dashoffset 1.6s cubic-bezier(.16,.7,.2,1)';
        g.el.style.strokeDashoffset=String(off);
      }
      g.el.style.opacity = rev<0.05 ? 0 : 1;
    });

    const ev=s.event;
    const box=document.getElementById('event');
    const rip=document.getElementById('ripples');
    rip.innerHTML='';
    if(ev){
      box.classList.add('show');
      const _es=document.getElementById('eseal');
      _es.textContent=ev.year;
      if(ev.col){ _es.style.borderColor=ev.col; _es.style.color=ev.col; }
      document.getElementById('etitle').textContent=ev.title;
      document.getElementById('esub').textContent=ev.esub||ev.sub;
      const [x,y]=project(ev.lon, ev.lat);
      const g=ns('g',{class:'ripple', transform:'translate('+x+','+y+')'});
      g.appendChild(ns('circle',{r:'16'}));
      g.appendChild(ns('circle',{r:'16'}));
      rip.appendChild(g);
    } else box.classList.remove('show');

    camTo=camFromStage(n);
    if(REDUCE || instant){
      cam.x=camTo.x; cam.y=camTo.y; cam.k=camTo.k;
      worldG.setAttribute('transform', worldTransform());
      placeLabels();
    }
  }

  function placeLabels(){
    const nodes=labelsEl.children;
    for(let i=0;i<nodes.length;i++){
      const lb=LABELS[i];
      const on=lb.stages.indexOf(stage)>=0;
      nodes[i].classList.toggle('on', on);
      if(!on) continue;
      const [sx,sy]=toScreen(lb.lon, lb.lat);
      if(sx<-40||sy<-20||sx>PROJ.W+40||sy>PROJ.H-120){ nodes[i].classList.remove('on'); continue; }
      nodes[i].style.left=sx+'px';
      nodes[i].style.top=sy+'px';
    }
  }

  let last=performance.now();
  function tick(now){
    const dt=Math.min(40, now-last); last=now;
    const a=REDUCE?1:(1-Math.exp(-dt/380));
    cam.x+=(camTo.x-cam.x)*a;
    cam.y+=(camTo.y-cam.y)*a;
    cam.k+=(camTo.k-cam.k)*a;
    if(worldG) worldG.setAttribute('transform', worldTransform());
    placeLabels();

    if(!REDUCE){
      const dpr=Math.min(window.devicePixelRatio||1,2);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.globalCompositeOperation='destination-out';
      ctx.fillStyle='rgba(0,0,0,0.18)';
      ctx.fillRect(0,0,PROJ.W,PROJ.H);
      ctx.globalCompositeOperation='lighter';
      ctx.save();
      ctx.translate(PROJ.W/2, PROJ.H/2);
      ctx.scale(cam.k, cam.k);
      ctx.translate(-cam.x, -cam.y);
      particles.forEach(p=>{
        const g=routeGeom[p.gi];
        const rev=g.rt.reveal[stage];
        if(rev<0.05) return;
        p.t+=p.sp*(dt/16);
        if(p.t>rev) p.t-=rev;
        if(p.t<0) p.t+=rev;
        const samples=g.samples;
        const idx=Math.max(0, Math.min(samples.length-2, Math.floor(p.t*(samples.length-1))));
        const pa=samples[idx], pb=samples[idx+1]||pa;
        const dx=pb.x-pa.x, dy=pb.y-pa.y;
        ctx.strokeStyle=g.rt.color;
        ctx.globalAlpha=0.62;
        ctx.lineWidth=p.w;
        ctx.lineCap='round';
        ctx.beginPath();
        ctx.moveTo(pa.x-dx*2.1, pa.y-dy*2.1);
        ctx.lineTo(pa.x, pa.y);
        ctx.stroke();
      });
      ctx.restore();
      ctx.globalAlpha=1;
    }
    requestAnimationFrame(tick);
  }

  /* UI */
  const steps=document.getElementById('steps');
  STAGES.forEach((s,i)=>{
    const b=document.createElement('button');
    b.type='button';
    b.textContent=(i+1)+'  '+s.y.replace('년경','');
    b.addEventListener('click',()=>{ stopPlay(); applyStage(i); });
    steps.appendChild(b);
  });
  function stopPlay(){ playing=false; document.getElementById('play').textContent='재생'; if(playTimer){clearInterval(playTimer); playTimer=null;} }
  document.getElementById('play').addEventListener('click',()=>{
    if(playing){ stopPlay(); return; }
    playing=true; document.getElementById('play').textContent='멈춤';
    playTimer=setInterval(()=>{ applyStage((stage+1)%STAGES.length); }, REDUCE?4000:7000);
  });
  addEventListener('keydown', e=>{
    if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); stopPlay(); applyStage(stage+1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); stopPlay(); applyStage(stage-1); }
    else if(/^[1-5]$/.test(e.key)){ stopPlay(); applyStage(+e.key-1); }
    else if(e.key==='f'||e.key==='F'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.(); }
  });
  let sx=null;
  addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; }, {passive:true});
  addEventListener('touchend', e=>{
    if(sx==null) return;
    const dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dx)>44){ stopPlay(); applyStage(stage+(dx<0?1:-1)); }
    sx=null;
  });
  let resizeT;
  addEventListener('resize', ()=>{
    clearTimeout(resizeT);
    resizeT=setTimeout(()=>{ build(); }, 120);
  });

  build();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
